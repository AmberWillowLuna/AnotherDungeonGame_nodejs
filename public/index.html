<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shared Map with Chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="grid-container hidden" id="grid"></div>

    <div class="sidebar">
      <div class="player-form" id="playerForm">
        <h3>Choose nickname and color</h3>
        <input type="text" id="nickname" placeholder="Twój nick" maxlength="16">
        <input type="color" id="color" value="#ff0000">
        <h3>Choose your class</h3>

        <select id="classInput">
            <option value="barbarian">Barbarian</option>
            <option value="wizard">Wizard</option>
            <option value="paladin">Paladin</option>
            <option value="rogue">Rogue</option>
            <option value="bard">Bard</option>
        </select>
        <button id="joinBtn">Join</button>
      </div>

      <div class="status hidden" id="status">
        <strong id="place"></strong>
        <div id="countdown"></div>
      </div>

      <div class="inventory hidden" id="inventory">
        <h3>Inventory</h3>
        <div id="inventoryList"></div>
      </div>

      <div class="chat hidden" id="chat">
        <div class="messages" id="messages"></div>
        <input type="text" id="messageInput" placeholder="Napisz wiadomość...">
        <button id="sendBtn">Wyślij</button>
      </div>
    </div>
  </div>
  <div>
    <h3>cell translation</h3>
    <p>Nothing: White <br>
    Next room: Light Blue<br>
   Exit: Blue<br>
    Common chest: Peru<br>
    Uncommon chest: Silver<br>
    Rare chest: Gold<br>
    Sus wall: Gray<br>
    Statue: Orange<br>
    Dungeon enter: Green (lightgreen) <br>
    Enemies: Red <br>
    Bosses: Dark Red <br>
  </p>
  </div>
  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="client.js"></script>
</body>
</html>
